# Prometheus configuration for Muninn
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "muninn_alerts.yml"

scrape_configs:
  - job_name: 'muninn'
    static_configs:
      - targets: ['muninn:9090']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'muninn-shard'
    static_configs:
      - targets: ['muninn-shard-0:9090', 'muninn-shard-1:9090']
    metrics_path: '/metrics'
    scrape_interval: 5s
