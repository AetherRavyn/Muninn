[package]
name = "muninn-api"
version = "0.1.0"
edition = "2021"
description = "REST and gRPC API layer for Muninn"

[dependencies]
muninn-core = { path = "../muninn-core" }
muninn-storage = { path = "../muninn-storage" }
muninn-embedding = { path = "../muninn-embedding" }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
