[package]
name = "muninn-core"
version = "0.1.0"
edition = "2021"
description = "Core data model, traits, and types for Muninn memory system"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
prost = "0.13"
bytes = "1"
secrecy = { version = "0.10", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
async-trait = "0.1"
toml = "0.8"
bincode = "1"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1"
