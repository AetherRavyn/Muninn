[package]
name = "muninn-grpc"
version = "0.1.0"
edition = "2021"
description = "Internal gRPC-like API for Muninn"

[dependencies]
muninn-core = { path = "../muninn-core" }
muninn-storage = { path = "../muninn-storage" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
