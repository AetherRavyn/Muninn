[package]
name = "muninn-lib"
version = "0.1.0"
edition = "2021"
description = "Offline library for Muninn - no API server required"

[dependencies]
muninn-core = { path = "../muninn-core" }
muninn-storage = { path = "../muninn-storage" }
muninn-embedding = { path = "../muninn-embedding" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = "1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
