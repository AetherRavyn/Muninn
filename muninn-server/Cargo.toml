[package]
name = "muninn-server"
version = "0.1.0"
edition = "2021"
description = "Muninn server binary"

[[bin]]
name = "muninn"
path = "src/main.rs"

[dependencies]
muninn-core = { path = "../muninn-core" }
muninn-api = { path = "../muninn-api" }
muninn-grpc = { path = "../muninn-grpc" }
muninn-storage = { path = "../muninn-storage" }
muninn-embedding = { path = "../muninn-embedding" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
