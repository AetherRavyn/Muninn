[package]
name = "muninn-storage"
version = "0.1.0"
edition = "2021"
description = "Durable storage layer with WAL, HNSW vector index, and tantivy full-text search"

[dependencies]
muninn-core = { path = "../muninn-core" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
parking_lot = "0.12"
bytes = "1"
crc32fast = "1"
memmap2 = "0.9"
bincode = "1"
tantivy = "0.22"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
muninn-core = { path = "../muninn-core" }
muninn-embedding = { path = "../muninn-embedding" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
