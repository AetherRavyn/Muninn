# Muninn Configuration
# See muninn-core/src/config.rs for all options

[server]
grpc_port = 50051
rest_port = 3000
# tls_cert_path = "/etc/muninn/tls/cert.pem"
# tls_key_path = "/etc/muninn/tls/key.pem"
# jwt_secret = "${MUNINN_JWT_SECRET}"
request_timeout_ms = 30000

[storage]
data_dir = "./data"
wal_dir = "./data/wal"
snapshot_dir = "./data/snapshots"
shard_count = 1
max_wal_size_bytes = 104857600  # 100MB
checkpoint_interval_secs = 300
# encryption_key = "${MUNINN_ENCRYPTION_KEY}"
# replica_endpoint = "muninn-replica:50051"

[retrieval]
max_results = 10
min_score = 0.1
index_algorithm = "Hnsw"

[retrieval.default_weights]
weight_relevance = 0.5
weight_recency = 0.2
weight_importance = 0.2
weight_keyword = 0.1
decay_rate = 0.01

[security]
require_tls = true
api_key_header = "X-Api-Key"
tenant_isolation_strict = true
audit_log_enabled = true
# audit_log_path = "/var/log/muninn/audit.log"

[security.source_rate_limits]
max_writes_per_minute = 100
max_bytes_per_minute = 1048576
max_influence_score_per_hour = 50.0

[consolidation]
enabled = true
interval_secs = 60
batch_size = 100
max_concurrent_jobs = 2
quarantine_trust_tier = true
anomaly_detection_enabled = true

[embedding]
provider = "openai"
model = "text-embedding-3-small"
dimension = 1536
batch_size = 32
timeout_ms = 10000
# api_key = "${MUNINN_EMBEDDING_API_KEY}"
# api_base_url = "https://api.openai.com"

[observability]
log_level = "info"
metrics_port = 9090
health_port = 8080
# tracing_endpoint = "http://jaeger:4318"
